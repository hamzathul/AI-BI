# Workspace members — apps and shared packages appear here as the project grows.
packages:
  - "apps/*"
  - "packages/*"
# Dependency install scripts: allowlist what may run, deny the rest.
# Prisma's preinstall checks the Node version; @prisma/engines downloads the
# engines the CLI needs for migrations. Swagger UI's @scarf/scarf is optional
# telemetry and never runs.
allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  prisma: true
  unrs-resolver: true
